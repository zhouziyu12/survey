<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>问卷入口</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#5b6475; --accent:#2f6fde; --accent-text:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1e232b; --text:#e8ebf0; --muted:#9aa3b2; --accent:#5b8ff0; --accent-text:#0d1117; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:16px; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif; }
  .card { width:100%; max-width:440px; background:var(--card); border-radius:14px; padding:32px 24px;
          box-shadow:0 2px 12px rgba(0,0,0,.08); text-align:center; }
  h1 { font-size:22px; margin:0 0 12px; }
  p { color:var(--muted); line-height:1.6; margin:0 0 24px; }
  button { width:100%; padding:14px; font-size:17px; border:0; border-radius:10px;
           background:var(--accent); color:var(--accent-text); cursor:pointer; }
  button:disabled { opacity:.6; }
  .fallback { margin-top:16px; font-size:14px; display:none; }
  .fallback a { color:var(--accent); }
</style>
</head>
<body>
<main class="card">
  <h1>问卷调查 / Questionnaire</h1>
  <p>感谢参与！点击下方按钮开始答题。<br>Thank you for taking part. Tap the button below to begin.</p>
  <button id="go" type="button">开始答题 / Start questionnaire</button>
  <div class="fallback" id="fallback">如果没有自动跳转，请<a id="link" href="#">点击这里</a>。</div>
</main>
<script>
  // Five versions, equal 20% probability. Codes A–E are neutral; respondents never see them.
  var VERSIONS = {
    A: "https://v.wjx.cn/vm/hFAiwZM.aspx",
    B: "https://v.wjx.cn/vm/thxff5E.aspx",
    C: "https://v.wjx.cn/vm/OLP0UDy.aspx",
    D: "https://v.wjx.cn/vm/rXmu832.aspx",
    E: "https://v.wjx.cn/vm/Q0UeDgk.aspx"
  };
  var KEY = "survey_version_v1";
  var codes = Object.keys(VERSIONS);

  function randomIndex(n) {
    try {
      var buf = new Uint32Array(1), limit = Math.floor(4294967296 / n) * n;
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    } catch (e) { return Math.floor(Math.random() * n); }
  }

  function pickVersion() {
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved && VERSIONS[saved]) return saved;           // same browser keeps its version
    var code = codes[randomIndex(codes.length)];
    try { localStorage.setItem(KEY, code); } catch (e) {}
    return code;
  }

  document.getElementById("go").addEventListener("click", function () {
    var url = VERSIONS[pickVersion()];
    this.disabled = true;
    document.getElementById("link").href = url;
    document.getElementById("fallback").style.display = "block";
    window.location.href = url;
  });
</script>
</body>
</html>
